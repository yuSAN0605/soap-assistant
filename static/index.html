<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOAP Assistant - 臨床記録画像解析</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide">SOAP Assistant</h1>
        <span class="text-xs bg-indigo-700 px-3 py-1 rounded-full">画像解析特化モード</span>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- 入力セクション -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-4">
            <h2 class="font-semibold text-lg text-indigo-900 border-b pb-2">入力データ</h2>
            
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">追加テキスト・メモ（任意）</label>
                <textarea id="inputText" rows="3" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="特記事項や補足情報を入力..."></textarea>
            </div>

            <!-- 画像・カメラ入力エリア -->
            <div class="flex flex-col gap-2">
                <label class="block text-sm font-medium text-slate-600">カルテ画像 / カメラ撮影</label>
                <div class="grid grid-cols-2 gap-2">
                    <!-- ファイル選択（複数枚OK） -->
                    <label class="cursor-pointer bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-sm font-medium py-2 px-3 rounded-lg text-center transition flex items-center justify-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        画像を選択
                        <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
                    </label>
                    <!-- カメラ直接起動ボタン -->
                    <button type="button" id="cameraBtn" class="cursor-pointer bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-sm font-medium py-2 px-3 rounded-lg text-center transition flex items-center justify-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812-1.22A2 2 0 0118.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        カメラで撮影
                    </button>
                    <!-- 非表示のカメラ用input（強制撮影属性付き） -->
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
                </div>
            </div>

            <!-- プレビュー＆削除コンテナ -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">選択中の画像（クリックで削除できます）</label>
                <div id="imagePreviewContainer" class="flex flex-wrap gap-2 min-h-[40px] p-2 bg-slate-50 border border-dashed border-slate-300 rounded-lg">
                    <span id="noImageText" class="text-xs text-slate-400 self-center">画像が選択されていません</span>
                </div>
            </div>

            <button id="generateBtn" class="mt-auto w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 shadow-sm">
                SOAP記録を生成する
            </button>
        </section>

        <!-- 出力セクション -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-4">
            <h2 class="font-semibold text-lg text-indigo-900 border-b pb-2">生成結果（SOAP）</h2>
            
            <div id="loading" class="hidden flex-1 flex flex-col items-center justify-center text-indigo-600 py-12">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mb-3"></div>
                <p class="text-sm">医療文書を高精度で解析して記録を生成中...</p>
            </div>

            <div id="resultContainer" class="flex flex-col gap-3 text-sm flex-1">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Progress（経過）</label>
                    <textarea id="resProgress" rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 font-mono text-xs"></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Notice（注意点）</label>
                    <input type="text" id="resNotice" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">S（Subjective）</label>
                    <input type="text" id="resS" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">OA（Objective / Assessment 統合）</label>
                    <textarea id="resOA" rows="6" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 font-mono text-xs"></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">P（Plan）</label>
                    <input type="text" id="resP" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs">
                </div>
            </div>

            <button id="copyBtn" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition duration-200 text-sm border border-slate-300">
                結果をクリップボードにコピー
            </button>
        </section>
    </main>

    <script>
        let base64Images = [];

        function compressImageToBase64(file, maxWidth = 2200, quality = 0.85) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(compressedDataUrl);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function updatePreview() {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = '';

            if (base64Images.length === 0) {
                container.innerHTML = '<span id="noImageText" class="text-xs text-slate-400 self-center">画像が選択されていません</span>';
                return;
            }

            base64Images.forEach((imgData, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'relative group w-16 h-16';

                const img = document.createElement('img');
                img.src = imgData;
                img.className = 'w-full h-full object-cover rounded-lg border border-slate-200 shadow-sm';

                const deleteBtn = document.createElement('button');
                deleteBtn.innerHTML = '&times;';
                deleteBtn.className = 'absolute -top-1.5 -right-1.5 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow hover:bg-red-600 transition';
                deleteBtn.title = 'この画像を削除';
                deleteBtn.onclick = () => {
                    base64Images.splice(index, 1);
                    updatePreview();
                };

                wrapper.appendChild(img);
                wrapper.appendChild(deleteBtn);
                container.appendChild(wrapper);
            });
        }

        async function handleFiles(files) {
            for (let file of files) {
                try {
                    const compressedBase64 = await compressImageToBase64(file);
                    base64Images.push(compressedBase64);
                } catch (err) {
                    console.error("画像の圧縮に失敗しました:", err);
                }
            }
            updatePreview();
        }

        document.getElementById('imageInput').addEventListener('change', async (e) => {
            await handleFiles(Array.from(e.target.files));
            e.target.value = '';
        });

        // カメラボタンクリックで、隠し持っている cameraInput を確実にプログラムから発火させる
        document.getElementById('cameraBtn').addEventListener('click', () => {
            document.getElementById('cameraInput').click();
        });

        document.getElementById('cameraInput').addEventListener('change', async (e) => {
            await handleFiles(Array.from(e.target.files));
            e.target.value = '';
        });

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const inputText = document.getElementById('inputText').value;
            if (!inputText && base64Images.length === 0) {
                alert('テキストまたは画像を入力してください。');
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultContainer').classList.add('opacity-50');

            try {
                const response = await fetch('/api/generate-soap', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        inputText: inputText,
                        karteImages: base64Images
                    })
                });

                if (!response.ok) throw new Error('サーバーエラーが発生しました');

                const data = await response.json();
                document.getElementById('resProgress').value = data.progress || '';
                document.getElementById('resNotice').value = data.notice || '';
                document.getElementById('resS').value = data.s || '';
                document.getElementById('resOA').value = data.oa || '';
                document.getElementById('resP').value = data.p || '';
            } catch (err) {
                alert(err.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('resultContainer').classList.remove('opacity-50');
            }
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const textToCopy = [
                `【経過】\n${document.getElementById('resProgress').value}`,
                `【注意点】\n${document.getElementById('resNotice').value}`,
                `【S】\n${document.getElementById('resS').value}`,
                `【OA】\n${document.getElementById('resOA').value}`,
                `【P】\n${document.getElementById('resP').value}`
            ].join('\n\n');

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('クリップボードにコピーしました！');
            });
        });
    </script>
</body>
</html>
